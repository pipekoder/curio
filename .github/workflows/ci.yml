name: CI
on:
  pull_request:
  push:
    branches: [feat/foundation, feat/meta-magazine-generator, feat/advertising-library-visual-magazine, feat/living-advertisements-sam-decoder, feat/d1-catalog-foundation, feat/d1-production-binding, feat/asset-intelligence-v1, feat/editorial-experience-v1, feat/demo-readiness-ai-editorial]
permissions:
  contents: read
jobs:
  # Core verification. The job id stays `verify` so the existing required
  # branch-protection check "CI / verify" keeps working unchanged.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx eslint shared/object-groups.ts shared/object-localization.ts tests/object-localization.test.ts shared/reader-media.ts worker/editorial-quality.ts tests/object-groups.test.ts scripts/replay-norm-sam.mjs
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - run: npm run test:integration
  # Browser verification runs in parallel with `verify` (no `needs:`).
  # It builds first because the suite serves `vite preview` from dist/.
  # NOTE: this adds a new "CI / browser" check — add it to the branch
  # protection required checks, or browser results stay advisory-only.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-verification
          path: test-results/
          if-no-files-found: ignore
