name: CI
on:
  pull_request:
  push:
    branches: [feat/foundation, feat/meta-magazine-generator, feat/advertising-library-visual-magazine, feat/living-advertisements-sam-decoder, feat/d1-catalog-foundation, feat/d1-production-binding]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:migration-workflow
      - run: npm run build
      - run: npm run worker:check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-verification
          path: test-results/
          if-no-files-found: ignore
